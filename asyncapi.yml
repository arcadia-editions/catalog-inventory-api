asyncapi: 3.0.0
info:
  title: "Arcadia Editions - Catalog Inventory"
  version: 0.0.1
  tags:
    - name: "Default"
    - name: "Inventory"
    - name: "InventoryBackoffice"

defaultContentType: application/json

channels:
  ReservationExpiredEventsChannel:
    address: "scheduler.events.reservation-expired"
    messages:
      ReleaseStockInputMessage:
        $ref: '#/components/messages/ReleaseStockInputMessage'
  StockReleasedEventsChannel:
    address: "catalog-inventory.events.stock-released"
    messages:
      StockReleasedMessage:
        $ref: '#/components/messages/StockReleasedMessage'
  StockReceivedEventsChannel:
    address: "catalog-inventory.events.stock-received"
    messages:
      StockReceivedMessage:
        $ref: '#/components/messages/StockReceivedMessage'
  StockAdjustedEventsChannel:
    address: "catalog-inventory.events.stock-adjusted"
    messages:
      StockAdjustedMessage:
        $ref: '#/components/messages/StockAdjustedMessage'

operations:
  doReleaseStock:
    action: receive
    tags:
      - name: Inventory
    channel:
      $ref: '#/channels/ReservationExpiredEventsChannel'
  onStockReleased:
    action: send
    tags:
      - name: Inventory
    channel:
      $ref: '#/channels/StockReleasedEventsChannel'
  onStockReceived:
    action: send
    tags:
      - name: InventoryBackoffice
    channel:
      $ref: '#/channels/StockReceivedEventsChannel'
  onStockAdjusted:
    action: send
    tags:
      - name: InventoryBackoffice
    channel:
      $ref: '#/channels/StockAdjustedEventsChannel'


components:
  messages:
    ReleaseStockInputMessage:
      name: ReleaseStockInputMessage
      title: ""
      summary: ""
      traits:
        - $ref: '#/components/messageTraits/CommonHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "avro/ReleaseStockInput.avsc"
    StockReservedMessage:
      name: StockReservedMessage
      title: ""
      summary: ""
      traits:
        - $ref: '#/components/messageTraits/CommonHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "avro/StockReserved.avsc"
    StockReleasedMessage:
      name: StockReleasedMessage
      title: ""
      summary: ""
      traits:
        - $ref: '#/components/messageTraits/CommonHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "avro/StockReleased.avsc"
    StockReceivedMessage:
      name: StockReceivedMessage
      title: ""
      summary: ""
      traits:
        - $ref: '#/components/messageTraits/CommonHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "avro/StockReceived.avsc"
    StockAdjustedMessage:
      name: StockAdjustedMessage
      title: ""
      summary: ""
      traits:
        - $ref: '#/components/messageTraits/CommonHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "avro/StockAdjusted.avsc"

  messageTraits:
    CommonHeaders:
      headers:
        type: object
        properties:
          kafka_messageKey:
            type: "integer"
            format: "int64"
            description: This header value will be populated automatically at runtime
            x-runtime-expression: $message.payload#/id
          # CloudEvents Attributes
          ce-id:
            type: string
            description: Unique identifier for the event
            x-runtime-expression: $message.payload#{#this.id}
          ce-source:
            type: string
            description: URI identifying the context where event happened
            x-runtime-expression: $message.payload#{"Inventory"}
          ce-specversion:
            type: string
            description: CloudEvents specification version
            x-runtime-expression: $message.payload#{"1.0"}
          ce-type:
            type: string
            description: Event type
            x-runtime-expression: $message.payload#{#this.getClass().getSimpleName()}
          ce-time:
            type: string
            description: Timestamp of when the event happened
            x-runtime-expression: $message.payload#{T(java.time.Instant).now().toString()}


