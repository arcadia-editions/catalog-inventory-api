asyncapi: 3.0.0
id: urn:com.arcadiaeditions:catalog:inventory:asyncapi
info:
  title: "Arcadia Editions - Catalog Inventory"
  version: 0.0.1
  tags:
    - name: "Default"
    - name: "Inventory"
    - name: "InventoryBackoffice"

defaultContentType: application/json

channels:
  stock-released-event-v1:
    address: "catalog-inventory.stock-released.event.avro.v1"
    messages:
      StockReleasedMessage:
        $ref: '#/components/messages/StockReleasedMessage'
  stock-reservation-confirmed-event-v1:
    address: "catalog-inventory.stock-reservation-confirmed.event.avro.v1"
    messages:
      StockReservationConfirmedMessage:
        $ref: '#/components/messages/StockReservationConfirmedMessage'
  stock-received-event-v1:
    address: "catalog-inventory.stock-received.event.avro.v1"
    messages:
      StockReceivedMessage:
        $ref: '#/components/messages/StockReceivedMessage'
  stock-adjusted-event-v1:
    address: "catalog-inventory.stock-adjusted.event.avro.v1"
    messages:
      StockAdjustedMessage:
        $ref: '#/components/messages/StockAdjustedMessage'

operations:
  onStockReleased:
    action: send
    tags:
      - name: Inventory
    channel:
      $ref: '#/channels/stock-released-event-v1'
  onStockReservationConfirmed:
    action: send
    tags:
      - name: Inventory
    channel:
      $ref: '#/channels/stock-reservation-confirmed-event-v1'
  onStockReceived:
    action: send
    tags:
      - name: InventoryBackoffice
    channel:
      $ref: '#/channels/stock-received-event-v1'
  onStockAdjusted:
    action: send
    tags:
      - name: InventoryBackoffice
    channel:
      $ref: '#/channels/stock-adjusted-event-v1'


components:
  messages:
    StockReservedMessage:
      name: StockReservedMessage
      title: ""
      summary: ""
      traits:
        - $ref: '#/components/messageTraits/CommonHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "avro/StockReserved.avsc"
    StockReleasedMessage:
      name: StockReleasedMessage
      title: ""
      summary: ""
      traits:
        - $ref: '#/components/messageTraits/CommonHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "avro/StockReleased.avsc"
    StockReservationConfirmedMessage:
      name: StockReservationConfirmedMessage
      title: ""
      summary: ""
      traits:
        - $ref: '#/components/messageTraits/CommonHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "avro/StockReservationConfirmed.avsc"
    StockReceivedMessage:
      name: StockReceivedMessage
      title: ""
      summary: ""
      traits:
        - $ref: '#/components/messageTraits/CommonHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "avro/StockReceived.avsc"
    StockAdjustedMessage:
      name: StockAdjustedMessage
      title: ""
      summary: ""
      traits:
        - $ref: '#/components/messageTraits/CommonHeaders'
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "avro/StockAdjusted.avsc"

  messageTraits:
    CommonHeaders:
      headers:
        type: object
        properties:
          kafka_messageKey:
            type: "integer"
            format: "int64"
            description: This header value will be populated automatically at runtime
            x-runtime-expression: $message.payload#/id
          # CloudEvents Attributes
          ce-id:
            type: string
            description: Unique identifier for the event
            x-runtime-expression: $message.payload#{#this.id}
          ce-source:
            type: string
            description: URI identifying the context where event happened
            x-runtime-expression: $message.payload#{"Inventory"}
          ce-specversion:
            type: string
            description: CloudEvents specification version
            x-runtime-expression: $message.payload#{"1.0"}
          ce-type:
            type: string
            description: Event type
            x-runtime-expression: $message.payload#{#this.getClass().getSimpleName()}
          ce-time:
            type: string
            description: Timestamp of when the event happened
            x-runtime-expression: $message.payload#{T(java.time.Instant).now().toString()}

