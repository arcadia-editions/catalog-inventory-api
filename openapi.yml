openapi: 3.0.1
info:
  title: Arcadia Editions - Catalog Inventory
  version: "0.2.1"
  description: Arcadia Editions - Catalog Inventory
  contact:
    email: email@domain.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:

- description: API
  url: /api

- description: custom
  url: "{protocol}://{server}/{path}"
  variables:
    protocol:
      enum:
      - http
      - https
      default: http
    server:
      default: localhost:8080
    path:
      default: api

tags:

- name: Default
  description: Operations that are not assigned to a service.

- name: Inventory

- name: InventoryBackoffice

paths:
  /inventory/reservations/reserve:
    post:
      operationId: reserveStock
      description: reserveStock
      tags:
      - Inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveStockInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReserveStockResult"
        "400":
          description: Invalid request
  /inventory/reservations/confirm:
    post:
      operationId: confirmStockReservation
      description: Returns CONFIRMED with no change when every line is already CONFIRMED
        (redelivery).
      tags:
      - Inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmStockReservationInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmStockReservationResult"
        "400":
          description: Invalid request
  /inventory/positions:
    post:
      operationId: createInventoryPosition
      description: createInventoryPosition
      tags:
      - InventoryBackoffice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryPositionInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPosition"
        "400":
          description: Invalid request
  /inventory/{sku}/stock-intakes:
    post:
      operationId: receiveStock
      description: receiveStock
      tags:
      - InventoryBackoffice
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveStockInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPosition"
        "400":
          description: Invalid request
  /inventory/{sku}/adjustments:
    post:
      operationId: adjustStock
      description: adjustStock
      tags:
      - InventoryBackoffice
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustStockInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPosition"
        "400":
          description: Invalid request

components:
  schemas:
    ReserveStockInput:
      type: object
      x-business-entity: ReserveStockInput
      required:
      - orderId
      - items
      properties:
        orderId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReserveStockItemInput"
          minItems: 1
    ConfirmStockReservationInput:
      type: object
      x-business-entity: ConfirmStockReservationInput
      required:
      - orderId
      properties:
        orderId:
          type: string
    CreateInventoryPositionInput:
      type: object
      x-business-entity: CreateInventoryPositionInput
      required:
      - sku
      - initialQuantity
      properties:
        sku:
          type: string
        initialQuantity:
          type: integer
          format: int32
    ReceiveStockInput:
      type: object
      x-business-entity: ReceiveStockInput
      required:
      - sku
      - quantity
      properties:
        sku:
          type: string
        quantity:
          type: integer
          format: int32
        reason:
          type: string
        reference:
          type: string
    AdjustStockInput:
      type: object
      x-business-entity: AdjustStockInput
      required:
      - sku
      - quantityDelta
      - reason
      properties:
        sku:
          type: string
        quantityDelta:
          type: integer
          format: int32
        reason:
          $ref: "#/components/schemas/StockAdjustmentReason"
        reference:
          type: string
    ReserveStockResult:
      type: object
      x-business-entity: ReserveStockResult
      required:
      - outcome
      properties:
        outcome:
          $ref: "#/components/schemas/ReserveStockOutcome"
        reserved:
          $ref: "#/components/schemas/StockReservedResult"
        unavailable:
          $ref: "#/components/schemas/StockUnavailableResult"
    ConfirmStockReservationResult:
      type: object
      x-business-entity: ConfirmStockReservationResult
      required:
      - outcome
      properties:
        outcome:
          $ref: "#/components/schemas/ConfirmStockReservationOutcome"
        confirmed:
          $ref: "#/components/schemas/StockReservationConfirmedResult"
        notHeld:
          $ref: "#/components/schemas/StockReservationNotHeldResult"
    InventoryPosition:
      type: object
      x-business-entity: InventoryPosition
      required:
      - sku
      - availableQuantity
      - reservedQuantity
      - soldQuantity
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        version:
          type: integer
          default: "null"
          description: "Version of the document (required in PUT for concurrency control,\
            \ should be null in POSTs)."
        sku:
          type: string
        availableQuantity:
          type: integer
          format: int32
        reservedQuantity:
          type: integer
          format: int32
        soldQuantity:
          type: integer
          format: int32
    StockReservedResult:
      type: object
      x-business-entity: StockReservedResult
      properties:
        orderId:
          type: string
        expiresAt:
          type: string
          format: date-time
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/StockReservedLine"
    StockUnavailableResult:
      type: object
      x-business-entity: StockUnavailableResult
      properties:
        orderId:
          type: string
        unavailableItems:
          type: array
          items:
            $ref: "#/components/schemas/StockUnavailableLine"
    StockReservedLine:
      type: object
      x-business-entity: StockReservedLine
      properties:
        reservationId:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          format: int32
        reservedAt:
          type: string
          format: date-time
    StockReservationConfirmedResult:
      type: object
      x-business-entity: StockReservationConfirmedResult
      properties:
        orderId:
          type: string
        confirmedAt:
          type: string
          format: date-time
    ReserveStockItemInput:
      type: object
      x-business-entity: ReserveStockItemInput
      required:
      - sku
      - quantity
      properties:
        sku:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
    StockUnavailableLine:
      type: object
      x-business-entity: StockUnavailableLine
      properties:
        sku:
          type: string
        requestedQuantity:
          type: integer
          format: int32
        availableQuantity:
          type: integer
          format: int32
    ReserveStockOutcome:
      type: string
      x-business-entity: ReserveStockOutcome
      enum:
      - RESERVED
      - UNAVAILABLE
    ConfirmStockReservationOutcome:
      type: string
      x-business-entity: ConfirmStockReservationOutcome
      enum:
      - CONFIRMED
      - NOT_HELD
    StockAdjustmentReason:
      type: string
      x-business-entity: StockAdjustmentReason
      enum:
      - DAMAGED
      - LOST
      - FOUND
      - MANUAL_CORRECTION
      - RETURNED
    StockReservationNotHeldResult:
      type: object
      x-business-entity: StockReservationNotHeldResult
      properties:
        orderId:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:

- basicAuth: []

- bearerAuth: []
