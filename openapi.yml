openapi: 3.0.1
info:
  title: "Arcadia Editions - Catalog Inventory"
  version: 0.1.0
  description: "Arcadia Editions - Catalog Inventory"
  contact:
    email: email@domain.com
servers:
  - description: localhost
    url: http://localhost:8080/api
  - description: custom
    url: "{protocol}://{server}/{path}"
    variables:
      protocol:
        enum: ['http', 'https']
        default: 'http'
      server:
        default: 'localhost:8080'
      path:
        default: 'api'
tags:
  - name: "Default"
  - name: "Inventory"
  - name: "InventoryBackoffice"


paths:
  /inventory/reservations:
    post:
      operationId: reserveStock
      summary: "reserveStock"
      description: "reserveStock"
      tags: [Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveStockInput"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReserved"
  /inventory/positions:
    post:
      operationId: createInventoryPosition
      summary: "createInventoryPosition"
      description: "createInventoryPosition"
      tags: [InventoryBackoffice]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryPositionInput"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPosition"
  /inventory/{sku}/stock-intakes:
    post:
      operationId: receiveStock
      summary: "receiveStock"
      description: "receiveStock"
      tags: [InventoryBackoffice]
      parameters:
        - name: "sku"
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveStockInput"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPosition"
  /inventory/{sku}/adjustments:
    post:
      operationId: adjustStock
      summary: "adjustStock"
      description: "adjustStock"
      tags: [InventoryBackoffice]
      parameters:
        - name: "sku"
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustStockInput"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPosition"

components:
  schemas:
    ReserveStockInput:
      type: "object"
      x-business-entity: "ReserveStockInput"
      required:
      - "orderId"
      - "sku"
      - "quantity"
      properties:
        orderId:
          type: "string"
        sku:
          type: "string"
        quantity:
          type: "integer"
          format: "int32"
    CreateInventoryPositionInput:
      type: "object"
      x-business-entity: "CreateInventoryPositionInput"
      required:
      - "sku"
      - "initialQuantity"
      properties:
        sku:
          type: "string"
        initialQuantity:
          type: "integer"
          format: "int32"
    ReceiveStockInput:
      type: "object"
      x-business-entity: "ReceiveStockInput"
      required:
      - "sku"
      - "quantity"
      properties:
        sku:
          type: "string"
        quantity:
          type: "integer"
          format: "int32"
        reason:
          type: "string"
        reference:
          type: "string"
    AdjustStockInput:
      type: "object"
      x-business-entity: "AdjustStockInput"
      required:
      - "sku"
      - "quantityDelta"
      - "reason"
      properties:
        sku:
          type: "string"
        quantityDelta:
          type: "integer"
          format: "int32"
        reason:
          $ref: "#/components/schemas/StockAdjustmentReason"
        reference:
          type: "string"
    StockReserved:
      type: "object"
      x-business-entity: "StockReserved"
      properties:
        reservationId:
          type: "string"
        orderId:
          type: "string"
        sku:
          type: "string"
        quantity:
          type: "integer"
          format: "int32"
        reservedAt:
          type: "string"
          format: "date-time"
        expiresAt:
          type: "string"
          format: "date-time"
    InventoryPosition:
      type: "object"
      x-business-entity: "InventoryPosition"
      required:
      - "sku"
      - "availableQuantity"
      - "reservedQuantity"
      - "soldQuantity"
      properties:
        id:
          type: "integer"
          format: "int64"
          readOnly: true
        version:
          type: "integer"
          default: "null"
          description: "Version of the document (required in PUT for concurrency control,\
            \ should be null in POSTs)."
        sku:
          type: "string"
        availableQuantity:
          type: "integer"
          format: "int32"
        reservedQuantity:
          type: "integer"
          format: "int32"
        soldQuantity:
          type: "integer"
          format: "int32"
    StockAdjustmentReason:
      type: "string"
      x-business-entity: "StockAdjustmentReason"
      enum:
      - "DAMAGED"
      - "LOST"
      - "FOUND"
      - "MANUAL_CORRECTION"
      - "RETURNED"

    Page:
      type: object
      required:
        - "content"
        - "totalElements"
        - "totalPages"
        - "size"
        - "number"
      properties:
        number:
          type: integer
          minimum: 0
        numberOfElements:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 0
          maximum: 200
          multipleOf: 25
        totalElements:
          type: integer
        totalPages:
          type: integer

  parameters:
    page:
      name: page
      in: query
      description: The number of results page
      schema:
        type: integer
        format: int32
        default: 0
    limit:
      name: limit
      in: query
      description: The number of results in a single page
      schema:
        type: integer
        format: int32
        default: 20
    sort:
      name: sort
      in: query
      description: Sort results by field name and direction (asc or desc)
      schema:
        type: array
        items:
          type: string

  securitySchemes:
    basicAuth:     # <-- arbitrary name for the security scheme
      type: http
      scheme: basic
    bearerAuth:     # <-- arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT    # optional, arbitrary value for documentation purposes
security:
  - basicAuth: []  # <-- use the same name here
  - bearerAuth: []  # <-- use the same name here
